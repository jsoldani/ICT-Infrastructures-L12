services:

  web:
    build: ./web
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    depends_on:
      - db

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    volumes:
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata: