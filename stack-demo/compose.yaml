services:

  web:
    image: ictinfr/stack-demo-web:1.0
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    depends_on:
      - db
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
    volumes:
      - dbdata:/var/lib/postgresql/data
    deploy:
      replicas: 1

volumes:
  dbdata: